# EXP001 — imagem-por-sobrevivência (IARA_VISAO_SERES_COMO_AGUA.md §5)
# Pergunta: a população de Gabors-seres, só com pressão de sobreviver,
# reduz o resíduo de uma imagem? Chega perto do matching pursuit? A pirâmide
# (grosso→fino) emerge no histograma de frequência?

[experiment]
name = "exp001-image-survival"
seeds = [11, 22, 33]
max_ticks = 3000
log_every = 50
snapshot_every = 0

[world]
modality = "image"
target = "synthetic"   # ou caminho de um .png
size = 64

[life]
init = 48
cap = 3000
metabolism = 0.15
food_gain = 1.0
initial_energy = 2.0
max_energy = 10.0
repro_threshold = 8.0
repro_cost = 3.0
mutation_sigma = 0.25
life_tuning = true     # busca local na geometria durante a vida
tune_every = 3
rain_every = 20        # chuva de imigrantes nos hotspots do resíduo
rain_count = 6


[atoms]
freq_min = 0.015
freq_max = 0.45
sigma_min = 1.2
sigma_max = 24.0
