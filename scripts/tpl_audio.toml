# EXP002 — áudio-por-sobrevivência (teste de AGNOSTICISMO, visão §3/§5)
# MESMA física de exp001; muda só o átomo (Gabor1D = grão) e o IO (WAV).
# Pergunta: a população resolve um sinal 1D sem mudar uma linha de agua-life?

[experiment]
name = "exp002-audio-survival"
seeds = [11, 22, 33, 44, 55]
max_ticks = 3000
log_every = 100
snapshot_every = 0
mp_candidates = 0

[world]
modality = "audio"
target = "synthetic"   # ou caminho de um .wav PCM16 (mono/stereo)
size = 8192            # nº de amostras
sample_rate = 16000

[life]
init = 48
cap = 3000
metabolism = 0.02
food_gain = 1.0
initial_energy = 2.0
max_energy = 10.0
repro_threshold = 8.0
repro_cost = 3.0
mutation_sigma = 0.25
life_tuning = true
tune_every = 3
rain_every = 20
rain_count = 6

[atoms]
freq_min = 0.002       # grãos longos (graves) até
freq_max = 0.45        # ...quase Nyquist
sigma_min = 2.0
sigma_max = 400.0      # envelope longo pra tons contínuos
