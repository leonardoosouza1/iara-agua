# EXP003 — vídeo-por-sobrevivência (átomo espaço-temporal Gabor3D)
# MESMA física; átomo com envelope+portadora temporal. Pergunta: seres
# "surfam" o blob em movimento (freq_t > 0) ou viram átomos estáticos?

[experiment]
name = "exp003-video-survival"
seeds = [11, 22, 33]
max_ticks = 2000
log_every = 50
snapshot_every = 500

[world]
modality = "video"
target = "synthetic"   # v0: só sintético (frames PNG entram na bateria)
size = 48              # lado do frame
frames = 12

[life]
init = 48
cap = 300
metabolism = 0.02
food_gain = 1.0
initial_energy = 2.0
max_energy = 10.0
repro_threshold = 8.0
repro_cost = 3.0
mutation_sigma = 0.25
life_tuning = true
tune_every = 3
rain_every = 20
rain_count = 6

[atoms]
freq_min = 0.015
freq_max = 0.45
sigma_min = 1.2
sigma_max = 16.0
